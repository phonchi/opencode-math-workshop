<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="learning-route-title learning-route-desc"><title id="learning-route-title">從第一次對話，到用數學檢查成果</title><desc id="learning-route-desc">依序完成課前準備、初次對話、分群、PCA 與分類筆記，課後可選數學應用或 OpenCode 工作法；間距表示學習順序，不表示時間長短。</desc><defs><style>@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&amp;display=swap"); text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}</style><marker id="learning-route-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#555e73"/></marker><marker id="learning-route-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#b8503c"/></marker><marker id="learning-route-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a3c78"/></marker></defs><rect width="1120" height="440" fill="#f6f2e9"/><text x="48" y="56" text-anchor="start" font-size="28" font-weight="600" fill="#2a3c78">一段一段完成，成果留在自己的專案</text><text x="48" y="92" text-anchor="start" font-size="20" font-weight="500" fill="#555e73">學習順序｜每一步都先操作，再確認</text><line x1="104" y1="196" x2="1000" y2="196" stroke="#b7b0a5" stroke-width="1"/><line x1="104" y1="196" x2="104" y2="160" stroke="#b7b0a5"/><circle cx="104" cy="196" r="4" fill="#2a3c78"/><text x="104" y="148" text-anchor="middle" font-size="24" font-weight="500" fill="#2a3c78">課前準備</text><text x="104" y="176" text-anchor="middle" font-size="20" font-weight="500" fill="#555e73">建立環境</text><line x1="328" y1="196" x2="328" y2="220" stroke="#b7b0a5"/><circle cx="328" cy="196" r="4" fill="#2a3c78"/><text x="328" y="252" text-anchor="middle" font-size="24" font-weight="500" fill="#2a3c78">初次對話</text><text x="328" y="280" text-anchor="middle" font-size="20" font-weight="500" fill="#555e73">完成小任務</text><line x1="552" y1="196" x2="552" y2="160" stroke="#b7b0a5"/><circle cx="552" cy="196" r="4" fill="#2a3c78"/><text x="552" y="148" text-anchor="middle" font-size="24" font-weight="500" fill="#2a3c78">分群</text><text x="552" y="176" text-anchor="middle" font-size="20" font-weight="500" fill="#555e73">比較相似性</text><line x1="776" y1="196" x2="776" y2="220" stroke="#b7b0a5"/><circle cx="776" cy="196" r="4" fill="#2a3c78"/><text x="776" y="252" text-anchor="middle" font-size="24" font-weight="500" fill="#2a3c78">PCA</text><text x="776" y="280" text-anchor="middle" font-size="20" font-weight="500" fill="#555e73">理解投影</text><line x1="1000" y1="196" x2="1000" y2="160" stroke="#b7b0a5"/><circle cx="1000" cy="196" r="8" fill="#b8503c"/><text x="1000" y="148" text-anchor="middle" font-size="24" font-weight="500" fill="#2a3c78">分類與筆記</text><text x="1000" y="176" text-anchor="middle" font-size="20" font-weight="500" fill="#555e73">說明並驗證</text><line x1="48" y1="316" x2="1072" y2="316" stroke="#d8d1c4"/><text x="48" y="368" text-anchor="start" font-size="24" font-weight="600" fill="#2a3c78">課後自由延伸</text><text x="352" y="368" text-anchor="start" font-size="24" font-weight="600" fill="#2a3c78">數學應用</text><text x="352" y="404" text-anchor="start" font-size="20" font-weight="500" fill="#555e73">低秩近似・梯度下降・最短路徑</text><text x="752" y="368" text-anchor="start" font-size="24" font-weight="600" fill="#2a3c78">OpenCode 工作法</text><text x="752" y="404" text-anchor="start" font-size="20" font-weight="500" fill="#555e73">需求・分工・驗證・續作</text></svg>